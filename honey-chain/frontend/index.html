<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honey Chain — Blockchain + AI + IoT Honey Traceability</title>
    <meta name="description" content="Decentralized honey batch provenance, QR-based consumer verification, and smart IoT hive telemetry." />
    <script>
      // Clean up lingering service workers from other projects hosted on localhost
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
            console.log('Unregistered previous service worker:', registration);
          }
        });
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
